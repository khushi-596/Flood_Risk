name: flood-risk

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flood_risk
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood_risk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flood:flood@db:5432/flood_risk
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /workspace/data
      MODEL_CONFIG: /workspace/models/risk_engine/v1/risk_weights.yaml
      UPLOAD_DIR: /workspace/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data:ro
      - ./models:/workspace/models:ro
      - ./uploads:/workspace/uploads
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/v1
      NEXT_PUBLIC_MAP_STYLE_URL: https://demotiles.maplibre.org/style.json
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
