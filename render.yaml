# ─── Render Blueprint ─────────────────────────────────────────────────────────
# Deploy with: Connect this repo on https://dashboard.render.com → New Blueprint
# Docs: https://docs.render.com/infrastructure-as-code

databases:
  - name: flood-risk-db
    plan: free
    databaseName: flood_risk
    user: flood
    postgresMajorVersion: 16
    ipAllowList: []                 # Render internal only

services:
  # ── FastAPI backend ────────────────────────────────────────────────────────
  - type: web
    name: flood-risk-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flood-risk-db
          property: connectionString
      - key: REDIS_URL
        value: ""                   # Optional — app gracefully degrades without Redis
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://flood-risk-web.onrender.com,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: MUNICIPAL_DEMO_EMAIL
        value: staff@pune.gov.in
      - key: MUNICIPAL_DEMO_PASSWORD
        value: change-before-deployment
      - key: DATA_DIR
        value: /workspace/data
      - key: MODEL_CONFIG
        value: /workspace/models/risk_engine/v1/risk_weights.yaml
      - key: UPLOAD_DIR
        value: /workspace/uploads

  # ── Next.js frontend ──────────────────────────────────────────────────────
  - type: web
    name: flood-risk-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://flood-risk-api.onrender.com/v1
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json
