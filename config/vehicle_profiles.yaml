# Vehicle sensitivity profiles per competition workplan Section 7 / Dev A2
# Sensitivity multipliers and hard-avoid flood risk thresholds

vehicles:
  two_wheeler:
    risk_multiplier: 1.30
    caution_at: 0.30
    wait_at: 0.45
    avoid_at: 0.60
    label: Two-wheeler (motorcycle / scooter)
  car:
    risk_multiplier: 1.00
    caution_at: 0.40
    wait_at: 0.60
    avoid_at: 0.75
    label: Four-wheeler / Car
  bus:
    risk_multiplier: 0.85
    caution_at: 0.48
    wait_at: 0.68
    avoid_at: 0.85
    label: Public / Private Bus
  truck:
    risk_multiplier: 0.75
    caution_at: 0.52
    wait_at: 0.72
    avoid_at: 0.90
    label: Heavy Commercial Vehicle / Truck
